name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SalhaNAS.xcodeproj -scheme SalhaNAS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/SalhaNAS.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SalhaNAS.app Payload/
          zip -qry SalhaNAS.ipa Payload
          ls -lh SalhaNAS.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SalhaNAS.ipa \
            --title "صالحة NAS v1.0.${{ github.run_number }}" \
            --notes "ملف IPA غير موقّع — وقّعه بشهادتك في ESign ثم ثبّته." \
            --latest
